name: Native UI (legacy Slint)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 发布通过验收的 GitHub 测试版
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> native-desktop/target
      - name: 验证自动化的失败路径
        run: ./scripts/test-ui-automation.ps1
      - name: 测试、视觉回归与原生 EXE 验收
        run: ./scripts/verify-native-ui.ps1 -Package
      - name: 验证 Slint MCP 预览
        run: ./scripts/test-ui-mcp.ps1
      - name: 核对干净源码
        run: |
          if (@(git status --porcelain).Count -gt 0) { throw '构建或验收修改了源码，停止交付。' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ github.sha }}
          path: artifacts/automation/
          retention-days: 14
          if-no-files-found: error

  prerelease:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-ui-${{ github.sha }}
          path: evidence
      - name: 核对经过验收的原始产物
        env:
          VERIFIED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('evidence/verify')
          report = json.loads((root / 'verification.json').read_text(encoding='utf-8-sig'))
          assert report['Passed'] is True and report['Commit'] == os.environ['VERIFIED_COMMIT']
          assert 'package-and-native-startup' in report['Steps']
          filename = report['BinaryFile']
          assert pathlib.PurePath(filename).name == filename and filename.endswith('-windows-x64.exe')
          binary = root / 'package' / filename
          assert hashlib.sha256(binary.read_bytes()).hexdigest().upper() == report['BinarySha256'].upper()
          (root / 'release-notes.md').write_text(
              '自动 UI 测试版\n\n提交：' + report['Commit'] +
              '\n\n已通过固定视觉基线、Rust 测试、Clippy、Slint MCP 与当前 Runner 的 EXE 启动检查。'
              '\n\n软件渲染不代表 DX12、输入法、多档 DPI、多显示器或干净系统验收。'
              '此版本为预发布，不标记为最新正式版。\n', encoding='utf-8')
          PY
      - name: 发布测试版并核对附件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" evidence/verify/package/*.exe evidence/verify/package/SHA256SUMS.txt evidence/verify/package/acceptance.json evidence/verify/verification.json \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "GitHubSP UI candidate ${GITHUB_RUN_NUMBER}" --notes-file evidence/verify/release-notes.md
          gh release view "$tag" --json tagName,targetCommitish,isPrerelease,assets > evidence/published.json
          python - <<'PY'
          import json, pathlib
          release = json.loads(pathlib.Path('evidence/published.json').read_text())
          report = json.loads(pathlib.Path('evidence/verify/verification.json').read_text(encoding='utf-8-sig'))
          assert release['isPrerelease'] is True
          assert report['BinaryFile'] in {asset['name'] for asset in release['assets']}
          PY
