[package]
name = "githubsp-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GitHubSP Tauri 桌面下载工作台"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
githubsp_lib = { package = "githubsp-core", path = "../../core" }
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
rfd = "=0.16.0"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
